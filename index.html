<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>yyxy · 小站</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: #e2e8f0;
    text-align: center;
    padding: 24px;
    background: #0b1120;
    overflow: hidden;
    position: relative;
  }
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(600px 400px at 20% 15%, rgba(45, 212, 191, 0.22), transparent 60%),
      radial-gradient(700px 500px at 85% 80%, rgba(147, 197, 253, 0.18), transparent 60%),
      radial-gradient(500px 300px at 70% 10%, rgba(167, 139, 250, 0.14), transparent 60%),
      linear-gradient(135deg, #0b1120 0%, #111c33 55%, #0d2b2b 130%);
    z-index: 0;
  }
  .glow {
    position: absolute;
    width: 420px;
    height: 420px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(45, 212, 191, 0.16), transparent 65%);
    top: -120px;
    right: -80px;
    z-index: 0;
    pointer-events: none;
  }
  main { position: relative; z-index: 1; animation: rise .7s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  .tag {
    display: inline-block;
    font-size: 12px;
    letter-spacing: 0.28em;
    color: #5eead4;
    border: 1px solid rgba(94, 234, 212, 0.35);
    background: rgba(94, 234, 212, 0.08);
    border-radius: 999px;
    padding: 6px 14px 6px 16px;
    margin-bottom: 28px;
  }
  h1 {
    font-size: clamp(56px, 14vw, 96px);
    line-height: 1;
    letter-spacing: 0.1em;
    font-weight: 800;
    background: linear-gradient(92deg, #5eead4 10%, #93c5fd 55%, #c4b5fd 90%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p.sub { margin-top: 20px; font-size: 17px; color: #94a3b8; letter-spacing: 0.05em; }
  .card {
    margin: 44px auto 0;
    max-width: 420px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 20px;
    padding: 28px 28px 24px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
  }
  .card h2 { font-size: 14px; font-weight: 600; color: #cbd5e1; letter-spacing: 0.12em; margin-bottom: 6px; }
  .card p { font-size: 13px; color: #64748b; margin-bottom: 20px; }
  a.btn {
    display: block;
    padding: 13px 24px;
    border-radius: 999px;
    background: linear-gradient(90deg, #14b8a6, #0ea5e9);
    color: #fff;
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.04em;
    transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
    box-shadow: 0 8px 24px rgba(20, 184, 166, 0.35);
  }
  a.btn:hover { transform: translateY(-2px); filter: brightness(1.08); box-shadow: 0 12px 30px rgba(20, 184, 166, 0.45); }
  a.btn:active { transform: translateY(0); }
  footer { position: relative; z-index: 1; margin-top: 72px; font-size: 13px; color: #475569; letter-spacing: 0.08em; }
  footer span { color: #64748b; }
</style>
</head>
<body>
  <div class="glow"></div>
  <main>
    <div class="tag">WELCOME</div>
    <h1>yyxy</h1>
    <p class="sub">你好，这里是 yyxy 的小站。</p>
    <div class="card">
      <h2>邮 箱</h2>
      <p>mail.oco.icu · 云端邮箱</p>
      <a class="btn" href="https://mail.oco.icu">进入邮箱 →</a>
    </div>
  </main>
  <footer><span>yyxy.loc.cc</span></footer>
</body>
</html>
